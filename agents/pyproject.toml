[project]
name = "news-agents"
version = "0.1.0"
description = "Agent pipeline for news.josan.ai: scout, dedup, verify, publish"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "sqlalchemy>=2.1.3",
]

[project.optional-dependencies]
maf = [
    "agent-framework>=1.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/news_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.importlinter]
root_package = "news_agents"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Only the MAF runtime imports agent_framework"
type = "forbidden"
source_modules = [
    "news_agents.domain",
    "news_agents.ports",
    "news_agents.pipeline",
    "news_agents.scouts",
    "news_agents.clients",
    "news_agents.harvest",
]
forbidden_modules = ["agent_framework", "langchain"]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.83.0",
    "hypothesis>=6.168.3",
    "import-linter>=2.15",
    "mutmut>=3.8.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "radon>=6.0.1",
    "ruff>=0.16.10",
]
